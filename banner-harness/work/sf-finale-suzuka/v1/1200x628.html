<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SF 最終戦 鈴鹿 — 1200x628</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* X のタイムラインで中央が切り取られても読めるよう、主要情報を中央寄りの帯に集める */
  :root { --ink:#0a0a0a; --rouge:#ff1d4c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--ink); }
  main { position:relative; width:1200px; height:628px; overflow:hidden; background:var(--ink); color:#fff; font-family:"Noto Sans JP",sans-serif; }
  .photo { position:absolute; inset:0; width:1200px; height:628px; object-fit:cover; object-position:center 30%; }
  .scrim { position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,10,10,.92) 0%, rgba(10,10,10,.6) 12%, rgba(10,10,10,.1) 28%, rgba(10,10,10,.15) 46%, rgba(10,10,10,.88) 66%, var(--ink) 100%); }
  .corner { position:absolute; left:48px; top:40px; font-family:"Bebas Neue"; font-size:15px; letter-spacing:.28em; color:rgba(255,255,255,.8); white-space:nowrap; }
  .kicker-tr { position:absolute; right:48px; top:40px; font-family:"Bebas Neue"; font-size:15px; letter-spacing:.28em; color:var(--rouge); white-space:nowrap; }
  .block { position:absolute; left:48px; right:48px; top:420px; display:flex; align-items:flex-end; justify-content:space-between; }
  .left { display:flex; flex-direction:column; align-items:flex-start; }
  .kicker { font-family:"Bebas Neue"; font-size:18px; letter-spacing:.24em; color:var(--rouge); white-space:nowrap; }
  .series { margin-top:8px; font-family:"Anton"; font-size:68px; line-height:1; letter-spacing:.02em; white-space:nowrap; }
  .driverline { margin-top:14px; display:flex; align-items:center; gap:14px; }
  .driver { font-family:"Noto Serif JP"; font-weight:700; font-size:22px; line-height:1.3; white-space:nowrap; }
  .team { font-family:"Bebas Neue"; font-size:16px; letter-spacing:.22em; color:rgba(255,255,255,.85); white-space:nowrap; }
  .driverline img { height:38px; width:auto; }
  .right { display:flex; flex-direction:column; align-items:flex-end; border-left:3px solid var(--rouge); padding-left:24px; }
  .circuit { font-family:"Noto Serif JP"; font-weight:900; font-size:28px; line-height:1.2; white-space:nowrap; }
  .date { margin-top:6px; font-family:"Anton"; font-size:58px; line-height:1.05; letter-spacing:.03em; white-space:nowrap; }
</style>
</head>
<body>
<main data-canvas>
  <img class="photo" data-role="image" src="../../../../sf/images/wurz_low_angle.jpg" alt="">
  <div class="scrim" data-role="shape"></div>
  <div class="corner" data-role="text" id="corner">IMP × RACING</div>
  <div class="kicker-tr" data-role="text" id="jaf">JAF GRAND PRIX</div>
  <div class="block">
    <div class="left">
      <div class="kicker" data-role="text" id="kicker">SEASON FINALE — RD.11 / RD.12</div>
      <div class="series" data-role="text" id="series">SUPER FORMULA</div>
      <div class="driverline">
        <span class="driver" data-role="text" id="driver">チャーリー・ブルツ</span>
        <span class="team" data-role="text" id="team">#53 CHARLIE WURZ ／ TEAM GOH</span>
        <img data-role="logo" id="logo" src="../../../brands/impress-racing/assets/team_goh.png" alt="TEAM GOH">
      </div>
    </div>
    <div class="right">
      <div class="circuit" data-role="text" id="circuit">鈴鹿サーキット</div>
      <div class="date" data-role="text" id="date">11.20 – 11.22</div>
    </div>
  </div>
</main>
</body>
</html>
