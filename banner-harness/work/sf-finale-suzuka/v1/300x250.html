<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SF 最終戦 鈴鹿 — 300x250</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* 情報は banner.md 1〜3 に絞る。CTA・英字表記・ロゴは省く */
  :root { --ink:#0a0a0a; --rouge:#ff1d4c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--ink); }
  main { position:relative; width:300px; height:250px; overflow:hidden; background:var(--ink); color:#fff; font-family:"Noto Sans JP",sans-serif; }
  .photo { position:absolute; left:0; top:0; width:300px; height:118px; object-fit:cover; object-position:center 46%; }
  .scrim { position:absolute; left:0; top:0; width:300px; height:118px; background:linear-gradient(180deg, rgba(10,10,10,0) 55%, var(--ink) 100%); }
  .body { position:absolute; left:16px; right:16px; top:112px; display:flex; flex-direction:column; align-items:flex-start; }
  .kicker { font-family:"Bebas Neue"; font-size:12px; letter-spacing:.18em; color:var(--rouge); white-space:nowrap; }
  .series { margin-top:2px; font-family:"Anton"; font-size:32px; line-height:1.05; letter-spacing:.02em; white-space:nowrap; }
  .row { margin-top:6px; display:flex; align-items:baseline; gap:10px; }
  .circuit { font-family:"Noto Serif JP"; font-weight:900; font-size:14px; line-height:1.3; white-space:nowrap; }
  .date { font-family:"Anton"; font-size:22px; line-height:1.1; letter-spacing:.02em; white-space:nowrap; }
  .who { margin-top:6px; display:flex; align-items:baseline; gap:8px; }
  .driver { font-family:"Noto Serif JP"; font-weight:700; font-size:13px; line-height:1.3; white-space:nowrap; }
  .team { font-family:"Bebas Neue"; font-size:12px; letter-spacing:.16em; color:rgba(255,255,255,.85); white-space:nowrap; }
</style>
</head>
<body>
<main data-canvas>
  <img class="photo" data-role="image" src="../../../../sf/images/wurz_low_angle.jpg" alt="">
  <div class="scrim" data-role="shape"></div>
  <div class="body">
    <div class="kicker" data-role="text" id="kicker">SEASON FINALE — RD.11 / RD.12</div>
    <div class="series" data-role="text" id="series">SUPER FORMULA</div>
    <div class="row">
      <span class="circuit" data-role="text" id="circuit">鈴鹿サーキット</span>
      <span class="date" data-role="text" id="date">11.20 – 11.22</span>
    </div>
    <div class="who">
      <span class="driver" data-role="text" id="driver">チャーリー・ブルツ</span>
      <span class="team" data-role="text" id="team">TEAM GOH</span>
    </div>
  </div>
</main>
</body>
</html>
